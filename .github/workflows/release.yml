name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22.x'
  WAILS3_VERSION: 'latest'
  APP_NAME: 'eirin'
  REGISTRY: ghcr.io

jobs:
  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglib2.0-dev-bin libgdk-pixbuf2.0-dev librsvg2-common patchelf desktop-file-utils imagemagick

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install Wails3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Build application (production)
        run: wails3 build production=true

      - name: Package .zip
        run: |
          mkdir -p dist
          cd bin
          zip -r ../dist/${{ env.APP_NAME }}-linux-amd64.zip ${{ env.APP_NAME }}

      - name: Package .deb (nfpm)
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && VERSION="0.0.0-dev"
          cat > /tmp/nfpm.yaml <<EOF
          name: ${{ env.APP_NAME }}
          arch: amd64
          platform: linux
          version: ${VERSION}
          maintainer: "TaruDesigns <taruelec@gmail.com>"
          description: "Local astrophotography library manager"
          homepage: "https://github.com/${{ github.repository }}"
          license: "MIT"
          depends:
            - libwebkit2gtk-4.1-0
          contents:
            - src: ./bin/${{ env.APP_NAME }}
              dst: /usr/bin/${{ env.APP_NAME }}
            - src: ./build/appicon.png
              dst: /usr/share/pixmaps/${{ env.APP_NAME }}.png
          EOF
          nfpm package -f /tmp/nfpm.yaml -p deb -t dist/${{ env.APP_NAME }}-linux-amd64.deb

      - name: Install linuxdeploy + AppImage tooling
        run: |
          curl -Lo /tmp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          curl -Lo /tmp/linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/linuxdeploy-plugin-gtk.sh
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Package .AppImage
        run: |
          mkdir -p appdir/usr/bin appdir/usr/share/applications appdir/usr/share/icons/hicolor/256x256/apps
          cp bin/${{ env.APP_NAME }} appdir/usr/bin/${{ env.APP_NAME }}
          convert build/appicon.png -resize 256x256 appdir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png
          cat > appdir/usr/share/applications/${{ env.APP_NAME }}.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Eirin
          Exec=${{ env.APP_NAME }}
          Icon=${{ env.APP_NAME }}
          Categories=Graphics;Photography;
          EOF
          export NO_STRIP=true
          export DEPLOY_GTK_VERSION=3
          /tmp/linuxdeploy.AppImage --appimage-extract-and-run --appdir appdir \
            --plugin gtk \
            --desktop-file appdir/usr/share/applications/${{ env.APP_NAME }}.desktop \
            --icon-file appdir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png \
            --output appimage
          mkdir -p dist
          mv Eirin*.AppImage dist/${{ env.APP_NAME }}-linux-amd64.AppImage || mv eirin*.AppImage dist/${{ env.APP_NAME }}-linux-amd64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: dist/*

  build-server-image:
    name: Build & push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-linux-amd64
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
