name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22.x'
  # Wails targets the GTK3/webkit2gtk-4.1 stack on Linux (see build/linux/Taskfile.yml)
  GOFLAGS: '-tags=gtk3'

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Install frontend deps
        run: npm ci --prefix frontend

      # The root package embeds frontend/dist, so it must exist before Go lint/build
      - name: Build frontend
        run: just build-frontend

      - name: Lint
        run: just lint

      - name: Type-check
        run: just check

      - name: Test
        run: just test

      # The headless viewer (-tags server) compiles different files and must stay read-only
      - name: Test (server build)
        run: just test-server
