name: Landing page

on:
  push:
    branches: [main]
    paths:
      - 'landingpage/**'
      - 'docs/img/**'
      - 'docs/vid/**'
      - '.github/workflows/landingpage.yml'
  pull_request:
    paths:
      - 'landingpage/**'
      - 'docs/img/**'
      - 'docs/vid/**'
      - '.github/workflows/landingpage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landingpage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install deps
        run: npm ci --prefix landingpage

      - name: Check
        run: |
          npm run check --prefix landingpage
          npm run lint --prefix landingpage

      - name: Build
        run: npm run build --prefix landingpage

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: landingpage/dist

  # PRs only build; pushes to main deploy. Requires Settings → Pages → Source: GitHub Actions.
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
