version: '3'

info:
  companyName: "TaruDesigns"
  productName: "Eirin"
  productIdentifier: "com.tarudesigns.eirin"
  description: "Astrophotography library manager"
  copyright: "(c) 2025, TaruDesigns"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task linux:build
      type: blocking
    - cmd: wails3 task linux:run
      type: primary
