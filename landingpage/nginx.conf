server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sits behind a reverse proxy: keep redirects relative so they use the public host/scheme.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;

    # Content-hashed build output (images, video, CSS): safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ $uri.html =404;
    }
}
